name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Never run two deployments at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

  deploy:
    name: Deploy to AWS
    needs: test
    # Only on pushes to main, and only once the infrastructure exists and the repository variables are set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request an OIDC token from GitHub
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4

      # Exchange GitHub's short-lived token for temporary AWS credentials. No stored access keys.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload the static front end to S3
        run: aws s3 sync src/main/resources/static "s3://$FRONTEND_BUCKET" --delete

      - name: Deploy the backend container on the server (Systems Manager, no SSH)
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $TAG" \
            --timeout-seconds 600 \
            --parameters "commands=[\"/opt/storage/deploy.sh $TAG\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{out:StandardOutputContent,err:StandardErrorContent}" --output text | tail -40
          if [ "$STATUS" != "Success" ]; then echo "Deploy failed with status $STATUS"; exit 1; fi

      - name: Clear the CloudFront cache for the front end
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
