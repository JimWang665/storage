spring.application.name=storage

# --- Database: all environment-specific values come from environment variables.
# Defaults below are for local development only; no real secrets live in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydatabase?allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates the schema. (A production system would use Flyway migrations instead.)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.web.resources.static-locations=classpath:/static/

# --- Health check for the load balancer / container health check.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.port=${PORT:8080}
server.shutdown=graceful

# Return our own error messages (e.g. "Item Not Found!") in error responses so the UI can show them.
server.error.include-message=always

# Set DELETE_ALL_ENABLED=false on a public deployment so visitors cannot wipe the table.
app.delete-all-enabled=${DELETE_ALL_ENABLED:true}
